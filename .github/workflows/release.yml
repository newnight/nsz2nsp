name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Nsz.app (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build app (${{ matrix.arch }})
        run: ARCH=${{ matrix.arch }} ./make_app.sh

      - name: Smoke test CLI
        run: |
          BIN="$(swift build -c release --arch ${{ matrix.arch }} --show-bin-path)/nszcli"
          [ -f "$BIN" ] || { echo "CLI binary not found at $BIN"; exit 1; }
          file "$BIN"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ./tests/run_tests.sh
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nsz-${{ matrix.arch }}
          path: build/Nsz-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/Nsz-*.zip
